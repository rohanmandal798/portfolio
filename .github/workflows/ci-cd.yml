name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "kubernetes/deployment.yaml"
  pull_request:
    branches: [main]

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

# Cancel superseded PR runs; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io

# TIP: pin every third-party action to a full commit SHA (keep the tag in a
# comment) and let Dependabot update them. Tags below are for readability.

jobs:
  # ============================================================
  # UNIT TESTING
  # ============================================================
  test:
    name: Unit Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Skips only if no "test" script exists; real failures fail the job.
      - run: npm test --if-present

  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint

  # ============================================================
  # SECURITY: SAST, dependencies, secrets, IaC misconfig
  # ============================================================
  security:
    name: Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # CodeQL results
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

      # Secrets + misconfig (Dockerfile, kubernetes/ manifests) in the repo
      - name: Trivy secret and misconfig scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, lint, security]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Remove this upload (and the download in `docker`) if your Dockerfile
      # builds the app itself in a multi-stage build.
      - uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # ============================================================
  # DOCKER: build, scan, push exactly what was scanned, sign
  # ============================================================
  docker:
    name: Docker Build, Scan and Push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signing

    outputs:
      image_repo: ${{ steps.names.outputs.image_repo }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: dist/

      - name: Lowercase image name (GHCR requires it)
        id: names
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "image_repo=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pick a tag to scan
        id: scanref
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "ref=$(echo "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"

      # Report-only pass: produces SARIF for the Security tab
      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload SARIF
        if: >
          always() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Gate: fails the job on fixable HIGH/CRITICAL findings
      - name: Trivy image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: table
          scanners: vuln,secret
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

      # Push the very image that was scanned (no rebuild)
      - name: Push scanned image
        id: push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
          FIRST_TAG="$(echo "$TAGS" | head -n1)"
          REPO_DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$FIRST_TAG")"
          echo "digest=${REPO_DIGEST#*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPO: ${{ steps.names.outputs.image_repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REPO}@${DIGEST}"

  # ============================================================
  # UPDATE KUBERNETES MANIFEST (GitOps)
  # ============================================================
  update-k8s:
    name: Update Kubernetes Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production # add required reviewers in repo settings for a manual gate
    permissions:
      contents: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      # PAT kept only because pushing to a protected main may require it.
      # Use a fine-grained token scoped to this repo (Contents: write) only.
      # If main is not protected, replace with ${{ github.token }}.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.TOKEN }}

      - name: Setup Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update image in manifest (by digest)
        env:
          IMAGE_REPO: ${{ needs.docker.outputs.image_repo }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          export IMAGE_REF="${IMAGE_REPO}@${DIGEST}"

          # Only touches containers whose image belongs to this repo,
          # so sidecars and initContainers from elsewhere are left alone.
          yq -i '
            (.spec.template.spec.containers[]
              | select(.image | startswith(strenv(IMAGE_REPO)))
            ).image = strenv(IMAGE_REF)
          ' kubernetes/deployment.yaml

          echo "Updated deployment image:"
          grep "image:" kubernetes/deployment.yaml

      - name: Commit and push
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes changes detected."
            exit 0
          fi

          git commit -m "Update Kubernetes deployment image to ${DIGEST} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
